name: Signed release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write

jobs:
  sign-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check signing configuration
        run: |
          $required = @{
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            SIGNPATH_ORGANIZATION_ID = $env:SIGNPATH_ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNPATH_SIGNING_POLICY_SLUG
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object Key)
          if ($missing.Count -gt 0) {
            throw "Signed release is unavailable. Missing SignPath configuration: $($missing -join ', ')"
          }
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Validate release tag and plugin
        run: |
          $manifest = Get-Content -Raw ".\plugins\instruction-switcher\.codex-plugin\plugin.json" | ConvertFrom-Json
          if ("v$($manifest.version)" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match plugin version $($manifest.version)"
          }
          node .\scripts\validate-plugin.mjs
      - name: Run Node tests
        run: node --test .\plugins\instruction-switcher\tests\*.test.mjs
      - name: Build unsigned companion
        run: |
          New-Item -ItemType Directory -Force -Path ".\artifacts\unsigned" | Out-Null
          .\plugins\instruction-switcher\scripts\build-companion.ps1 -OutputPath ".\artifacts\unsigned\InstructionSwitcherCompanion.exe"
      - name: Test companion lifecycle
        run: .\plugins\instruction-switcher\tests\companion-lifecycle.test.ps1 -AssemblyPath ".\artifacts\unsigned\InstructionSwitcherCompanion.exe"
      - name: Test library packages
        run: .\plugins\instruction-switcher\tests\library-package.test.ps1 -AssemblyPath ".\artifacts\unsigned\InstructionSwitcherCompanion.exe"
      - name: Test theme transition layer
        run: .\plugins\instruction-switcher\tests\theme-transition-layer.test.ps1 -AssemblyPath ".\artifacts\unsigned\InstructionSwitcherCompanion.exe"
      - name: Upload unsigned artifact for SignPath
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: instruction-switcher-unsigned-${{ github.sha }}
          path: artifacts/unsigned/InstructionSwitcherCompanion.exe
          if-no-files-found: error
          retention-days: 7
      - name: Submit SignPath signing request
        id: sign
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: "${{ env.SIGNPATH_API_TOKEN }}"
          organization-id: "${{ env.SIGNPATH_ORGANIZATION_ID }}"
          project-slug: "${{ env.SIGNPATH_PROJECT_SLUG }}"
          signing-policy-slug: "${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}"
          github-artifact-id: "${{ steps.upload-unsigned-artifact.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: artifacts/signed
      - name: Verify signed executable
        id: verify
        run: |
          $signedFiles = @(Get-ChildItem -LiteralPath ".\artifacts\signed" -Filter "*.exe" -Recurse)
          if ($signedFiles.Count -ne 1) {
            throw "Expected one signed EXE, found $($signedFiles.Count)"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $signedFiles[0].FullName
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Authenticode verification failed: $($signature.Status) $($signature.StatusMessage)"
          }
          $signTool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if (-not $signTool) {
            $kitRoot = Join-Path ([Environment]::GetEnvironmentVariable('ProgramFiles(x86)')) 'Windows Kits\10\bin'
            $signTool = Get-ChildItem $kitRoot -Filter "signtool.exe" -Recurse |
              Where-Object FullName -Match "\\x64\\" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if (-not $signTool) {
            throw "signtool.exe was not found"
          }
          $signToolPath = if ($signTool -is [IO.FileInfo]) { $signTool.FullName } else { $signTool.Source }
          & $signToolPath verify /pa /all /v $signedFiles[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw "signtool verification failed with exit code $LASTEXITCODE"
          }
          New-Item -ItemType Directory -Force -Path ".\artifacts\release" | Out-Null
          $releaseExe = Join-Path (Resolve-Path ".\artifacts\release") "InstructionSwitcherCompanion.exe"
          Copy-Item -LiteralPath $signedFiles[0].FullName -Destination $releaseExe -Force
          Copy-Item -LiteralPath ".\plugins\instruction-switcher\LICENSE" -Destination ".\artifacts\release\LICENSE.txt" -Force
          Copy-Item -LiteralPath ".\plugins\instruction-switcher\NOTICE" -Destination ".\artifacts\release\NOTICE.txt" -Force
          $hash = (Get-FileHash -LiteralPath $releaseExe -Algorithm SHA256).Hash
          "release_exe=$releaseExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "signer=$($signature.SignerCertificate.Subject)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Attest signed executable
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: ${{ steps.verify.outputs.release_exe }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_REQUEST_URL: ${{ steps.sign.outputs.signing-request-web-url }}
          RELEASE_EXE: ${{ steps.verify.outputs.release_exe }}
          RELEASE_SHA256: ${{ steps.verify.outputs.sha256 }}
          RELEASE_SIGNER: ${{ steps.verify.outputs.signer }}
        run: |
          @"
          Authenticode signer: $env:RELEASE_SIGNER
          SignPath request: $env:SIGNING_REQUEST_URL
          SHA-256: $env:RELEASE_SHA256
          Code signing policy: https://github.com/foryourhealth111-pixel/Silly-codex/blob/main/CODE_SIGNING_POLICY.md

          Install command:
          codex plugin marketplace add foryourhealth111-pixel/Silly-codex --ref $env:GITHUB_REF_NAME
          codex plugin add instruction-switcher@silly-codex
          "@ | Set-Content -Path ".\artifacts\release-notes.md" -Encoding utf8
          gh release create $env:GITHUB_REF_NAME "$env:RELEASE_EXE#InstructionSwitcherCompanion.exe" ".\artifacts\release\LICENSE.txt#LICENSE.txt" ".\artifacts\release\NOTICE.txt#NOTICE.txt" --verify-tag --title $env:GITHUB_REF_NAME --notes-file ".\artifacts\release-notes.md"
